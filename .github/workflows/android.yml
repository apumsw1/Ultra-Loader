name: Build Ultra Loader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          test -s app/release-keystore.jks

      - name: Build Debug, Signed Release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease bundleRelease
          rm -f app/release-keystore.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Loader-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Loader-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Loader-Play-Store-AAB
          path: app/build/outputs/bundle/release/app-release.aab
